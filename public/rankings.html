<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rankings | CreatorBase</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>

<body>

<header>

<nav class="navbar">

    <div class="logo">
        <h2>CreatorBase</h2>
    </div>

    <button id="menuToggle" class="menu-toggle">
        ☰
    </button>

    <ul id="navLinks" class="nav-links">

        <li><a href="index.html">Home</a></li>

        <li><a href="compare.html">Battle</a></li>

        <!-- <li><a href="rankings.html" class="active">Rankings</a></li> -->

    </ul>

    <button id="themeToggle">🌙</button>

</nav>

</header>

<main>

    <!-- HERO -->

    <section class="hero">

        <h1>

            Creator Rankings

        </h1>

        <p>

            Browse, filter and rank every creator in the CreatorBase database.

        </p>

    </section>

    <!-- FILTERS -->

    <section class="rankings-controls">

        <input
            type="text"
            id="rankingSearch"
            placeholder="Search creators..."
        >

        <select id="categoryFilter">

            <option value="all">All Categories</option>

        </select>

        <select id="countryFilter">

            <option value="all">All Countries</option>

        </select>

        <select id="verifiedFilter">

            <option value="all">All Creators</option>
            <option value="verified">Verified Only</option>
            <option value="unverified">Unverified Only</option>

        </select>

    </section>

    <!-- TABLE -->

    <section class="leaderboard">

        <div class="panel-header">

            <h2>

                Global Rankings

            </h2>

            <span id="creatorCount">

                0 Creators

            </span>

        </div>

        <table>

            <thead>

    <tr>

        <th>#</th>

        <th id="sortName">

            Creator ⬍

        </th>

        <th id="sortCategory">

            Category ⬍

        </th>

        <th id="sortCountry">

            Country ⬍

        </th>

        <th id="sortOverall">

            Overall ⬍

        </th>

    </tr>

</thead>

            <tbody id="rankingsBody">

            </tbody>

        </table>

    </section>

</main>

<footer>

    <p>

        © 2026 CreatorBase

    </p>

<script src="js/theme.js"></script>
<script src="js/rankings.js"></script>

</body>
</html>
