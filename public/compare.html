<body>

<header>

    <nav>

        <div class="logo">

    <div class="battle-search">

        <div class="search-wrapper">

            <input
                id="creatorOne"
                type="text"
                placeholder="Choose Challenger..."

                id="creatorOneResults"
                class="search-results"
            ></div>

        </div>

        <div class="battle-vs">

            VS

        </div>

        <div class="search-wrapper">

            <input
                id="creatorTwo"
                type="text"
                placeholder="Choose Opponent..."
                autocomplete="off"
            >

            <div
                id="creatorTwoResults"
                class="search-results"
            ></div>

        </div>

    </div>

    <button id="compareBtn" class="battle-button">

        ⚔️ Start Battle
