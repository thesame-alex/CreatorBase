<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creator Battle | CreatorBase</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/compare.css">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">

</head>

<body>

<header>

    <nav>

        <div class="logo">

            <h2>CreatorBase</h2>

            <span>Creator Analytics Database</span>

        </div>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="compare.html" class="active">Battle</a></li>

            <li><a href="rankings.html">Rankings</a></li>

        </ul>

        <button id="themeToggle">🌙</button>

    </nav>

</header>

<main class="battle-page">

    <!-- =========================
         TOP CONTROLS
    ========================== -->

    <section class="battle-controls">

        <select id="battleCategory">

            <option value="">Choose Category</option>

        </select>

        <div class="battle-search-row">

            <div class="search-wrapper">

                <input
                    id="creatorOne"
                    type="text"
                    placeholder="Choose Challenger"
                    autocomplete="off"
                >

                <div
                    id="creatorOneResults"
                    class="search-results"
                ></div>

            </div>

            <div class="battle-vs">

                VS

            </div>

            <div class="search-wrapper">

                <input
                    id="creatorTwo"
                    type="text"
                    placeholder="Choose Opponent"
                    autocomplete="off"
                >

                <div
                    id="creatorTwoResults"
                    class="search-results"
                ></div>

            </div>

        </div>

        <button id="compareBtn">

            Start Battle

        </button>

    </section>



    <!-- =========================
         COMPARISON
    ========================== -->

    <section id="comparison" class="comparison-area">

        <div class="comparison-header">

            <h2 id="leftName">

                Challenger

            </h2>

            <h2 id="rightName">

                Opponent

            </h2>

        </div>



        <div class="radar-container">

            <canvas id="battleRadar"></canvas>

        </div>



        <div class="table-container">

            <table id="battleTable">

                <thead>

                    <tr id="tableHead">

                        <!-- compare.js -->

                    </tr>

                </thead>

                <tbody id="tableBody">

                    <!-- compare.js -->

                </tbody>

            </table>

        </div>

    </section>

</main>

<footer>

<p>

© 2026 CreatorBase

</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/theme.js"></script>

<script src="js/compare.js"></script>

</body>

</html>
